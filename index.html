<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Super Battle Tactics 2.0</title>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="robots" content="noindex, nofollow">
	<style>
		:root {
			color-scheme: dark;
			font-family: system-ui, sans-serif;
			color: #ecf2fc;
			background: #0b1019;
		}

		body { margin: 0; }
		[hidden] { display: none !important; }

		#stage, #status {
			position: fixed;
			inset: 0;
			display: grid;
			place-items: center;
		}
		#stage {
			inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
		}

		#canvas {
			display: block;
			width: 100%;
			height: min(100vh, 56.25vw);
			height: min(calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)), calc((100vw - env(safe-area-inset-left) - env(safe-area-inset-right)) * 0.5625));
			touch-action: none;
		}

		#canvas:focus { outline: none; }

		#status {
			box-sizing: border-box;
			padding: 18px;
			background: radial-gradient(ellipse at 50% 18%, #223451, #0b1019 70%);
		}

		.card {
			box-sizing: border-box;
			width: min(100%, 32rem);
			padding: clamp(1.25rem, 5vw, 2.5rem);
			border: 1px solid #3b4c68;
			border-top: 3px solid #ffbf66;
			border-radius: 10px;
			background: #141e2e;
			box-shadow: 0 14px 32px #050a14aa;
		}

		h1 {
			margin: 0 0 .7rem;
			font-size: clamp(1.5rem, 5vw, 2.25rem);
			line-height: 1.1;
			text-wrap: balance;
		}

		p { margin: 0; line-height: 1.5; }
		#status-message, #status-notice, #orientation p { color: #c4d0e4; }

		#status-progress {
			width: 100%;
			height: .65rem;
			margin: 1.15rem 0 0;
			accent-color: #ffbf66;
		}

		#status-percent {
			margin-top: .3rem;
			color: #ffcf85;
			font-variant-numeric: tabular-nums;
		}

		button {
			min-height: 44px;
			padding: .5rem .85rem;
			border: 1px solid #ffcd8d;
			border-radius: 5px;
			background: #ffbf66;
			color: #22170b;
			font: inherit;
			font-weight: 700;
			cursor: pointer;
		}

		button:focus-visible { outline: 3px solid #f3f7ff; outline-offset: 3px; }
		#retry { margin-top: 1.15rem; }

		#orientation {
			position: fixed;
			inset: auto max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
			box-sizing: border-box;
			max-width: 28rem;
			margin-inline: auto;
			padding: .85rem 1rem;
			border: 1px solid #3b4c68;
			border-radius: 8px;
			background: #141e2e;
		}

		#orientation-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .65rem; }
		#fullscreen { border-color: #526786; background: #23324b; color: #ecf2fc; }
	</style>
</head>
<body>
	<main id="stage">
		<canvas id="canvas" tabindex="0" aria-label="Área do jogo">Use um navegador com suporte a Canvas.</canvas>
	</main>
	<section id="status" aria-labelledby="game-name">
		<div class="card">
			<h1 id="game-name">Super Battle Tactics 2.0</h1>
			<p id="status-message" role="status">Carregando o jogo…</p>
			<p id="status-notice" role="alert" hidden></p>
			<progress id="status-progress" aria-label="Progresso do download" max="100"></progress>
			<p id="status-percent" aria-hidden="true" hidden></p>
			<button id="retry" type="button" hidden>Tentar novamente</button>
			<noscript>
				<style>#status-message, #status-progress { display: none; }</style>
				<p>Ative o JavaScript para jogar.</p>
			</noscript>
		</div>
	</section>
	<aside id="orientation" aria-label="Orientação da tela" hidden>
		<p id="orientation-text">Gire o aparelho para ampliar os controles.</p>
		<div id="orientation-actions">
			<button id="dismiss" type="button">Continuar assim</button>
			<button id="fullscreen" type="button" hidden>Tela cheia</button>
		</div>
	</aside>
	<script>
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","mainPack":"index-6898097.pck","experimentalVK":false,"fileSizes":{"index-6898097.pck":1115772,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
		const GODOT_THREADS_ENABLED = false;
		const canvas = document.getElementById('canvas');
		const status = document.getElementById('status');
		const statusMessage = document.getElementById('status-message');
		const notice = document.getElementById('status-notice');
		const progress = document.getElementById('status-progress');
		const percent = document.getElementById('status-percent');
		const retry = document.getElementById('retry');
		const orientation = document.getElementById('orientation');
		const fullscreen = document.getElementById('fullscreen');
		const mobilePortrait = matchMedia('(pointer: coarse) and (orientation: portrait) and (max-width: 800px)');
		const loadError = 'Falha ao carregar o jogo. Confira a conexão e tente novamente.';
		let playing = false;
		let orientationDismissed = false;
		let startupTimeout;
		let downloadedBytes = 0;

		function updateCanvasSize() {
			const pixelRatio = Math.min(devicePixelRatio || 1, 2);
			const width = Math.round(canvas.clientWidth * pixelRatio);
			const height = Math.round(canvas.clientHeight * pixelRatio);
			if (width > 0 && height > 0 && (canvas.width !== width || canvas.height !== height)) {
				canvas.width = width;
				canvas.height = height;
			}
		}

		function updateOrientation() {
			orientation.hidden = !playing || !mobilePortrait.matches || orientationDismissed || Boolean(document.fullscreenElement);
			if (!orientation.hidden && orientation.getBoundingClientRect().top < canvas.getBoundingClientRect().bottom) {
				orientation.hidden = true;
			}
		}

		async function toggleFullscreen() {
			try {
				if (document.fullscreenElement) {
					await document.exitFullscreen();
				} else {
					await document.documentElement.requestFullscreen();
				}
				canvas.focus();
			} catch {
				document.getElementById('orientation-text').textContent = 'Tela cheia indisponível. Gire o aparelho para ampliar os controles.';
			}
		}

		function showFailure(message, error) {
			if (playing || !retry.hidden) return;
			clearTimeout(startupTimeout);
			window.removeEventListener('unhandledrejection', handleStartupRejection);
			if (error) console.error(error);
			statusMessage.hidden = true;
			notice.textContent = message;
			notice.hidden = false;
			progress.hidden = true;
			percent.hidden = true;
			retry.hidden = false;
			retry.focus();
		}

		// O inicializador do Godot 4.7 pode deixar a rejeição do WASM fora da promessa de início.
		function handleStartupRejection(event) {
			showFailure(loadError, event.reason);
		}

		function waitForDownload() {
			clearTimeout(startupTimeout);
			startupTimeout = setTimeout(() => showFailure('O carregamento parou. Confira a conexão e tente novamente.'), 45000);
		}

		function reportProgress(current, total) {
			if (!retry.hidden) return;
			if (current > downloadedBytes) {
				downloadedBytes = current;
				waitForDownload();
			}
			if (total > 0) {
				const ratio = Math.min(100, Math.floor(current / total * 100));
				progress.value = ratio;
				percent.textContent = `${ratio}%`;
				percent.hidden = false;
				const label = ratio === 100 ? 'Preparando o jogo…' : 'Baixando o jogo…';
				if (statusMessage.textContent !== label) statusMessage.textContent = label;
			} else {
				progress.removeAttribute('value');
				percent.hidden = true;
			}
		}

		function loadEngineScript() {
			return new Promise((resolve, reject) => {
				const script = document.createElement('script');
				const timeout = setTimeout(() => {
					script.remove();
					reject(new Error('Tempo limite ao baixar o script do jogo.'));
				}, 45000);
				script.src = 'index.js';
				script.onload = () => { clearTimeout(timeout); resolve(); };
				script.onerror = () => { clearTimeout(timeout); reject(new Error('Falha ao baixar o script do jogo.')); };
				document.body.append(script);
			});
		}

		async function startGame() {
			try {
				await loadEngineScript();
				if (Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED }).length) {
					showFailure('O jogo precisa de WebGL 2 e WebAssembly. Abra esta página em um navegador atualizado.');
					return;
				}
				const engine = new Engine(GODOT_CONFIG);
				window.addEventListener('unhandledrejection', handleStartupRejection);
				waitForDownload();
				await engine.startGame({ canvas, canvasResizePolicy: 0, onProgress: reportProgress });
				if (!retry.hidden) return;
				clearTimeout(startupTimeout);
				window.removeEventListener('unhandledrejection', handleStartupRejection);
				playing = true;
				status.remove();
				updateOrientation();
			} catch (error) {
				showFailure(loadError, error);
			}
		}

		retry.addEventListener('click', () => window.location.reload());
		document.getElementById('dismiss').addEventListener('click', () => {
			orientationDismissed = true;
			updateOrientation();
			canvas.focus();
		});
		fullscreen.hidden = !document.fullscreenEnabled;
		fullscreen.addEventListener('click', toggleFullscreen);
		document.addEventListener('fullscreenchange', updateOrientation);
		canvas.addEventListener('keydown', (event) => {
			if (playing && document.fullscreenEnabled && !event.repeat && !event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'f') {
				event.preventDefault();
				toggleFullscreen();
			}
		});
		mobilePortrait.addEventListener('change', updateOrientation);
		new ResizeObserver(() => {
			updateCanvasSize();
			updateOrientation();
		}).observe(canvas);
		updateCanvasSize();
		startGame();
	</script>
</body>
</html>
